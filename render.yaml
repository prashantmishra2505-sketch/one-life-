databases:
  - name: eco_guardian_db
    databaseName: eco_guardian
    user: eco_admin
    plan: free

services:
  - type: web
    name: eco_guardian_api
    env: python
    rootDir: eco_guardian
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eco_guardian_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GEMINI_API_KEY
        sync: false
